services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: atlas-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: atlas-kafka-ui
    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: atlas-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    depends_on:
      - kafka

  postgres:
    image: postgres:16.14
    container_name: atlas-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: atlas-minio
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"

    volumes:
      - minio_data:/data

  connect:
    image: quay.io/debezium/connect:3.4
    container_name: atlas-connect
    ports:
      - "8083:8083"

    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: atlas-connect
      CONFIG_STORAGE_TOPIC: atlas-connect-configs
      OFFSET_STORAGE_TOPIC: atlas-connect-offsets
      STATUS_STORAGE_TOPIC: atlas-connect-status

    depends_on:
      - kafka
      - postgres

volumes:
  postgres_data:
  minio_data:

