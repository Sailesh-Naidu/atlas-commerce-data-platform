application:
  environment: local

spark:
  master: local[*]
  shuffle_partitions: 8
  broadcast_size_mb: 20
  adaptive_query_execution: True

storage:
  lakehouse_root: ./lakehouse
  checkpoint_root: ./checkpoint
  quarantine_root: ./quarantine

logging:
  level: INFO
  format: text
  log_directory: ./log
  destination: console
